<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tingee Onboarding Docs</title>

  <!-- Font tiếng Việt: Be Vietnam Pro -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <!-- TailwindCSS qua CDN (MVP, không cần build step) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // Cấu hình Tailwind: màu chính + font dự án
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: "#e12a41",
          },
          fontFamily: {
            sans: ["Be Vietnam Pro", "Inter", "system-ui", "sans-serif"],
          },
        },
      },
    };
  </script>

  <!-- CSS dự án (biến màu, base styles) -->
  <link rel="stylesheet" href="css/styles.css" />
</head>

<body class="font-sans text-slate-800 antialiased bg-slate-50">
  <!--
    Phase 2 (task 1) — Header: logo Tingee + tên trang.
    Layout 3 cột / sidebar / nội dung / TOC sẽ làm ở các task sau.
  -->
  <header class="sticky top-0 z-30 bg-white border-b border-slate-200">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center gap-3">
      <!--
        LOGO TINGEE — PLACEHOLDER.
        Thay monogram bên dưới bằng file logo chính thức (SVG/PNG) khi có asset thật.
      -->
      <a href="#" class="flex items-center gap-2.5" aria-label="Tingee — Trang tài liệu onboarding">
        <span class="inline-flex items-center justify-center w-9 h-9 rounded-lg bg-primary text-white font-bold leading-none">
          T
        </span>
        <span class="text-lg font-bold text-slate-900">Tingee</span>
      </a>
      <span class="hidden sm:block w-px h-6 bg-slate-200" aria-hidden="true"></span>
      <span class="hidden sm:block text-slate-500 font-medium">Onboarding Docs</span>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 py-10">
    <p class="text-slate-400">
      [NỘI DUNG CHỜ CẬP NHẬT] — layout 3 cột và nội dung tài liệu sẽ được thêm ở các task tiếp theo của Phase 2.
    </p>
  </main>

  <!-- Icon: Lucide -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- JS dự án -->
  <script src="js/main.js"></script>
</body>
</html>
